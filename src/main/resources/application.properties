# =====================================================
# User SOAP Service application.properties
# -----------------------------------------------------
# Энэ файл нь SOAP authentication service-ийн үндсэн тохиргоог хадгална.
# Service ажиллах port, database connection, JPA/Hibernate тохиргоо энд байна.
# =====================================================

# Spring Boot application-ийн нэр.
# Log дээр service-ийн нэрийг ялгаж харахад ашиглагдана.
spring.application.name=user-soap-service

# SOAP service 8081 port дээр ажиллана.
# API Gateway нь VPC private network-ээр энэ port руу request дамжуулдаг.
server.port=8081


# =====================================================
# PostgreSQL Database тохиргоо
# -----------------------------------------------------
# SOAP service register хийсэн хэрэглэгчдийг auth_user table-д хадгална.
# DB_URL, DB_USERNAME, DB_PASSWORD утгуудыг code дотор hardcode хийхгүй,
# systemd service-ийн Environment variable-уудаас уншиж байна.
# =====================================================

# DigitalOcean Managed PostgreSQL database-ийн JDBC URL.
spring.datasource.url=${DB_URL}

# Database username.
spring.datasource.username=${DB_USERNAME}

# Database password.
spring.datasource.password=${DB_PASSWORD}

# PostgreSQL JDBC driver.
spring.datasource.driver-class-name=org.postgresql.Driver


# =====================================================
# JPA / Hibernate тохиргоо
# -----------------------------------------------------
# AuthUser entity-г PostgreSQL table-тэй map хийхэд ашиглагдана.
# =====================================================

# ddl-auto=update гэдэг нь entity class дээр үндэслэн table structure-ийг автоматаар update хийнэ.
# Жишээ нь AuthUser entity нэмэхэд auth_user table автоматаар үүссэн.
spring.jpa.hibernate.ddl-auto=update

# SQL query-үүдийг log дээр харуулна.
# Development/demo үед ямар query ажиллаж байгааг харахад хэрэгтэй.
spring.jpa.show-sql=true